<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automação Vitai HIAM</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f6f4; color: #1f2937;
        }
        .container { width: min(900px, 92%); margin: 50px auto; }
        .card { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
        h1 { margin: 0 0 8px 0; color: #166534; font-size: 30px; }
        .subtitulo { margin-bottom: 30px; color: #6b7280; }
        .status { padding: 14px 18px; border-radius: 10px; background: #f3f4f6; margin-bottom: 25px; font-weight: bold; }
        .status.conectado { background: #dcfce7; color: #166534; }
        .status.erro { background: #fee2e2; color: #991b1b; }
        label { display: block; margin-bottom: 7px; font-weight: bold; }
        input { width: 100%; padding: 13px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 16px; margin-bottom: 18px; }
        button { border: none; border-radius: 9px; padding: 13px 20px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .btn-login { width: 100%; background: #166534; color: white; }
        .btn-login:hover { background: #14532d; }
        .painel { display: none; }
        .painel.visivel { display: block; }
        .titulo-painel { font-size: 22px; margin: 0 0 20px 0; }
        .exportacao { border: 1px solid #e5e7eb; border-radius: 12px; padding: 22px; background: #fafafa; }
        .datas { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .btn-exportar { margin-top: 5px; background: #15803d; color: white; width: 100%; }
        .btn-exportar:hover { background: #166534; }
        .mensagem { margin-top: 18px; padding: 12px; border-radius: 8px; display: none; }
        .mensagem.sucesso { display: block; background: #dcfce7; color: #166534; }
        .mensagem.erro { display: block; background: #fee2e2; color: #991b1b; }
        .oculto { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="card" id="cardLogin">
        <form style="max-width: 450px; margin: auto;" id="formLogin">
            <h1>Automação Vitai HIAM</h1>
            <div class="subtitulo">Acesso ao sistema</div>
            <div class="status" id="status">🔴 Desconectado</div>

            <label for="usuario">Usuário</label>
            <input type="text" id="usuario" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" required>

            <button type="submit" class="btn-login" id="btnLogin">ENTRAR NO VITAI</button>
        </form>
    </div>

    <div class="card painel" id="painel">
        <h1>Automação Vitai HIAM</h1>
        <div class="subtitulo">Painel de extração de relatórios (PA e Altas)</div>
        <div class="status conectado">🟢 Vitai conectado</div>

        <div class="exportacao" style="margin-bottom: 18px;">
            <div class="titulo-painel">📁 Pasta de Destino na Rede</div>
            <button class="btn-exportar" id="btnSelecionarPasta" type="button">SELECIONAR PASTA (VITAI_AUTOMATICO)</button>
            <div class="mensagem" id="statusPasta" style="display: block; margin-top: 12px;">⚠️ Nenhuma pasta configurada.</div>
        </div>

        <div class="exportacao">
            <div class="titulo-painel">📅 Período dos Relatórios</div>
            <div class="datas">
                <div><label>Data inicial</label><input type="date" id="dataInicial"></div>
                <div><label>Data final</label><input type="date" id="dataFinal"></div>
            </div>
            <button class="btn-exportar" id="btnExportar" type="button">EXECUTAR AUTOMAÇÃO (PA + ALTAS)</button>
            <div class="mensagem" id="mensagem"></div>
        </div>
    </div>
</div>

<script>
const cardLogin = document.getElementById("cardLogin");
const formLogin = document.getElementById("formLogin");
const painel = document.getElementById("painel");
const usuario = document.getElementById("usuario");
const senha = document.getElementById("senha");
const status = document.getElementById("status");
const dataInicial = document.getElementById("dataInicial");
const dataFinal = document.getElementById("dataFinal");
const btnExportar = document.getElementById("btnExportar");
const mensagem = document.getElementById("mensagem");
const btnSelecionarPasta = document.getElementById("btnSelecionarPasta");
const statusPasta = document.getElementById("statusPasta");

let pastaHandle = null;
const DB_NOME = "VitaiHIAMDB";
const DB_STORE = "config";

document.addEventListener("DOMContentLoaded", async () => {
    carregarDatasPadrao();
    await carregarPastaSalva();
});

function carregarDatasPadrao() {
    const ontem = new Date();
    ontem.setDate(ontem.getDate() - 1);
    dataInicial.value = ontem.toISOString().split("T")[0];
    dataFinal.value = ontem.toISOString().split("T")[0];
}

btnSelecionarPasta.addEventListener("click", async () => {
    try {
        pastaHandle = await window.showDirectoryPicker({ mode: "readwrite" });
        const db = await abrirDB();
        const tx = db.transaction(DB_STORE, "readwrite");
        tx.objectStore(DB_STORE).put(pastaHandle, "handlePasta");
        statusPasta.textContent = "✅ Pasta configurada: " + pastaHandle.name;
        statusPasta.className = "mensagem sucesso";
    } catch (e) {
        if (e.name !== "AbortError") alert("Erro ao selecionar pasta: " + e.message);
    }
});

function abrirDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NOME, 1);
        req.onupgradeneeded = () => req.result.createObjectStore(DB_STORE);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}

async function carregarPastaSalva() {
    try {
        const db = await abrirDB();
        const tx = db.transaction(DB_STORE, "readonly");
        const req = tx.objectStore(DB_STORE).get("handlePasta");
        req.onsuccess = async () => {
            if (req.result) {
                pastaHandle = req.result;
                if ((await pastaHandle.queryPermission({ mode: "readwrite" })) === "granted") {
                    statusPasta.textContent = "✅ Pasta configurada: " + pastaHandle.name;
                    statusPasta.className = "mensagem sucesso";
                } else {
                    statusPasta.textContent = "🔐 Clique em selecionar pasta para reautorizar a rede.";
                    statusPasta.className = "mensagem erro";
                }
            }
        };
    } catch (e) {}
}

formLogin.addEventListener("submit", (e) => {
    e.preventDefault();
    status.textContent = "🟡 Conectando ao Vitai HIAM...";
    window.postMessage({ type: "VITAI_LOGIN", username: usuario.value.trim(), password: senha.value }, "*");
});

window.addEventListener("message", (event) => {
    if (event.source !== window || !event.data) return;

    if (event.data.type === "LOGIN_VITAI_SUCESSO") {
        cardLogin.classList.add("oculto");
        painel.classList.add("visivel");
    }
    if (event.data.type === "LOGIN_VITAI_ERRO") {
        status.textContent = "✕ " + event.data.mensagem;
        status.className = "status erro";
    }
    if (event.data.type === "EXPORTACAO_SUCESSO") {
        btnExportar.disabled = false;
        btnExportar.textContent = "EXECUTAR AUTOMAÇÃO (PA + ALTAS)";
        mensagem.textContent = "✓ " + event.data.mensagem;
        mensagem.className = "mensagem sucesso";
    }
    if (event.data.type === "EXPORTACAO_ERRO") {
        btnExportar.disabled = false;
        btnExportar.textContent = "EXECUTAR AUTOMAÇÃO (PA + ALTAS)";
        mensagem.textContent = "✕ " + event.data.mensagem;
        mensagem.className = "mensagem erro";
    }
});

btnExportar.addEventListener("click", () => {
    if (!pastaHandle) {
        alert("Por favor, selecione primeiro a pasta de destino na rede.");
        return;
    }
    btnExportar.disabled = true;
    btnExportar.textContent = "PROCESSANDO RELATÓRIOS...";
    mensagem.textContent = "⏳ Navegando na árvore e gerando planilhas...";
    mensagem.className = "mensagem sucesso";

    const [anoI, mesI, diaI] = dataInicial.value.split("-");
    const [anoF, mesF, diaF] = dataFinal.value.split("-");

    window.postMessage({
        type: "EXPORTAR_RELATORIOS",
        dataInicial: `${diaI}/${mesI}/${anoI}`,
        dataFinal: `${diaF}/${mesF}/${anoF}`
    }, "*");
});
</script>
</body>
</html>
